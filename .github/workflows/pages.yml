name: Deploy academic website to GitHub Pages
on:
  push:
    branches: [hexo, main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public site
        run: python3 scripts/check_site.py
      - name: Prepare public files only
        run: |
          mkdir -p _site/assets
          cp index.html profile.html 404.html robots.txt sitemap.xml _site/
          cp assets/style.css assets/site.js assets/profile.js assets/favicon.svg assets/publications.json _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
